<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de X</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <table>
        <tr>
           <th colspan="5"> CHEFAO</th> 
        </tr>
        <tr>
            <th colspan="3">Guardiao1</th>
            <th colspan="2">Guardiao2</th>
        </tr>
        <tr>
            <th rowspan="3">Mestre1</th>
            <th colspan="2">Mestre2</th>
            <th>Mestre3</th>
            <th rowspan="5">Mestre4</th>
        </tr>
        <tr>
            <th>Lider1</th>
            <th>Lider2</th>
            <th>Lider3</th>
        </tr>
        <tr>
            <th>Co-Lider1</th>
            <th>Co-Lider2</th>
            <th>Co-Lider3</th>
        </tr>
        <tr>
            <th colspan="3">Tenente1</th>
            <th>Tenente2</th>
        </tr>
        <tr>
            <th rowspan="4">Sargento1</th>
            <th colspan="2">Sargento2</th>
            <th>Sargento3</th>
        </tr>
        <tr>
            <th>Cabo1</th>
            <th>Cabo2</th>
            <th>Cabo3</th>
            <th rowspan="3">Cabo4</th>
        </tr>
        <tr>
            <th>soldado1</th>
            <th>soldado2</th>
            <th>soldado3</th>
        </tr>
        <tr>
            <th>Recruta1</th>
            <th>Recruta2</th>
            <th>Recruta3</th>
        </tr>
    </table>
</body>
</html>
